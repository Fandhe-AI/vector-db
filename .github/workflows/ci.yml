name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR ごとに一意な番号を group に含める（head_ref のみだと fork 間で同名ブランチの
  # 別 PR が同一グループになり、互いの CI を cancel し合う。PR #4 codex P2 指摘）
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # lint-docs（ドキュメント／設定ファイル系 lint）
  # --------------------------------------------------
  # Fandhe-AI/actions の lint-docs reusable workflow（lint ツールバージョンは
  # 共通側で固定。agent-cli-skills の同名ジョブと同型）を呼び出す。
  # 設定はそれぞれ `.markdownlint.jsonc` / `.markdownlintignore` /
  # `.editorconfig` + `.editorconfig-checker.json` / `.yamllint` /
  # `commitlint.config.mjs` を参照する。
  #
  # 必須チェックの集約: reusable 側の集約ジョブ `lint-docs / lint-docs-complete`
  # （fail-closed。各 lint ジョブは boolean input の if: を持つ条件付きジョブとして
  # 明示リストで skipped を判定する）を branch protection の必須チェックに使う。
  # Rust 実装の着手時は rust-base-ci reusable workflow のジョブを本 workflow へ
  # 追加し、必須チェックへその集約ジョブ（rust-base-ci-complete）を加えること。
  lint-docs:
    # Fandhe-AI/actions は可変タグ latest（move-latest-tag 管理で main へ追従）で
    # 参照する（組織現行標準。AGENTS.md「CI・ワークフローの改変」の例外を参照）
    uses: Fandhe-AI/actions/.github/workflows/lint-docs.yml@latest
    permissions:
      contents: read
    with:
      # public リポジトリのため GitHub ホステッド runner を明示指定（組織 runner 方針）
      runner-label: ubuntu-latest
      markdownlint: true
      editorconfig: true
      yamllint: true
      # commitlint は PR の base/head から commit 範囲を取るため pull_request 専用
      # （reusable 側は他イベントを fail-closed で拒否する）。push でも動く本
      # workflow では event で切り替え、main への push では実行しない
      commitlint: ${{ github.event_name == 'pull_request' }}

  # --------------------------------------------------
  # rust-ci（Rust ベースライン品質ゲート: fmt / clippy / test / cargo-deny）
  # --------------------------------------------------
  # TASK-66 の workspace 追加（Cargo.toml）に伴い有効化。集約ジョブは reusable 側の
  # `rust-base-ci-complete`（本呼び出しからは `rust-ci / rust-base-ci-complete` として
  # 見える）。branch protection の必須チェックへ追加する運用はユーザー作業（PR 本文参照）。
  rust-ci:
    uses: Fandhe-AI/actions/.github/workflows/rust-base-ci.yml@latest
    permissions:
      contents: read
    with:
      # public リポジトリのため GitHub ホステッド runner を明示指定（lint-docs と同方針）
      runner-label: ubuntu-latest
      # make deny（Makefile の deny ターゲット）と同一のチェック集合
      deny-checks: advisories bans licenses sources

  # --------------------------------------------------
  # crash-test（クラッシュ耐性回帰テスト。TASK-142・対象ビヘイビア PERSIST-1）
  # --------------------------------------------------
  # プロセス外からの SIGKILL → 再起動 → 内容検証を行う回帰テスト（scripts/crash_test.sh）。
  # rust-ci（reusable workflow）とは異なり生の steps を持つ独立ジョブとして定義するため、
  # 第三者 action（actions/checkout）は SHA 固定で参照する
  # （AGENTS.md「CI・ワークフローの改変（P1）」。`@latest` が許されるのは Fandhe-AI/actions のみ）。
  # private submodule（docs/spec）は取得しない（spec 抜きでビルド・テストが成立する方針を維持）。
  # branch protection の必須チェックへ追加する運用は rust-ci と同様ユーザー作業（PR 本文参照）。
  crash-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Run crash-test
        run: make crash-test

  # --------------------------------------------------
  # crash-test-cross-table（2 テーブル横断トランザクション・クラッシュ耐性回帰テスト。
  # TASK-90・対象ビヘイビア TABLE-10）
  # --------------------------------------------------
  # プロセス外からの SIGKILL → 再起動 → テーブル間整合・バッチ整合の検証を行う回帰テスト
  # （scripts/crash_test_cross_table.sh）。rust-ci（reusable workflow）とは異なり生の
  # steps を持つ独立ジョブとして定義するため、第三者 action（actions/checkout）は SHA
  # 固定で参照する（AGENTS.md「CI・ワークフローの改変（P1）」。`@latest` が許されるのは
  # Fandhe-AI/actions のみ）。private submodule（docs/spec）は取得しない（spec 抜きで
  # ビルド・テストが成立する方針を維持）。
  # branch protection の必須チェックへ追加する運用は rust-ci と同様ユーザー作業（PR 本文参照）。
  crash-test-cross-table:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Run crash-test-cross-table
        run: make crash-test-cross-table

  # --------------------------------------------------
  # core-api-check（コア API シグネチャ差分検知。TASK-125・対象ビヘイビア CORE-1）
  # --------------------------------------------------
  # プロトコル層（wire-server 等）の追加・変更がコア API（VectorCore/SearchProvider）の
  # シグネチャ変更を伴わないことを scripts/check_core_api.sh（cargo 不要のテキスト比較）
  # で機械チェックする。rust-ci（reusable workflow）とは異なり生の steps を持つ独立
  # ジョブとして定義するため、第三者 action（actions/checkout）は SHA 固定で参照する
  # （AGENTS.md「CI・ワークフローの改変（P1）」。`@latest` が許されるのは Fandhe-AI/actions
  # のみ）。テキスト比較のみで Rust toolchain は不要なため checkout のみで完結する。
  # branch protection の必須チェックへ追加する運用は rust-ci と同様ユーザー作業（PR 本文参照）。
  core-api-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Run core-api-check
        run: make core-api-check

  # --------------------------------------------------
  # cross-check（aarch64 クロスコンパイル確認。TASK-156・対象ビヘイビア CORE-14）
  # --------------------------------------------------
  # `isa.rs` の NEON カーネル（`#[cfg(target_arch = "aarch64")]`）が x86_64 の
  # rust-ci ジョブではコンパイル対象に入らないため、`cargo check --target
  # aarch64-unknown-linux-gnu`（リンクしないためクロスリンカ不要）で構文・型検査
  # だけ別途確認する。rust-ci（reusable workflow）とは異なり生の steps を持つ独立
  # ジョブとして定義するため、第三者 action（actions/checkout）は SHA 固定で参照する
  # （AGENTS.md「CI・ワークフローの改変（P1）」。`@latest` が許されるのは Fandhe-AI/actions
  # のみ）。private submodule（docs/spec）は取得しない（spec 抜きでビルドが成立する方針を
  # 維持）。branch protection の必須チェックへ追加する運用は他ジョブと同様ユーザー作業
  # （PR 本文参照）。
  cross-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Add aarch64-unknown-linux-gnu target
        run: rustup target add aarch64-unknown-linux-gnu
      - name: Run check-cross
        run: make check-cross
