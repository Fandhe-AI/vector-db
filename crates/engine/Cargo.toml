# engine: コアロジック層（検索カーネル・認証・RLS 相当のテナント境界・redb 永続化）。
# wire-server から呼ばれるライブラリクレート（.claude/rules/delegation-impl.md 参照）。
# TASK-66 時点では雛形のみで依存を持たない。
[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "engine"
path = "src/lib.rs"

[dependencies]
# TASK-140（永続化層）: オーナー承認済み（Issue #16）の唯一の依存。
# .claude/rules/dependency-policy.md に従い完全固定（=x.y.z）で管理する。
redb = "=4.2.0"
# TASK-127 CORE-5（対照エンジン接続。Issue #176）: クレート・バージョンともに
# オーナー承認済み（2026-08-26。承認記録は Issue #176 のコメント、および
# `docs/spec/04-behavior/core-engine.md` CORE-5 の追記）。ライセンスは Apache-2.0
# （`deny.toml` の allow list 既存）。目的は
# `contrast_bench.rs` から対照エンジン（総当たり厳密最近傍）として呼び出すことのみで、
# `src/` 配下（ライブラリ公開面）は本依存に一切依存しない。`optional = true` ＋
# 下記 `contrast-bench` feature 限定とし、`wire-server` バイナリはリンクしない
# （`cargo tree -p wire-server` に出現しないことを CI 外の手元確認で担保）。
# .claude/rules/dependency-policy.md に従い完全固定（=x.y.z）で管理する。
usearch = { version = "=2.26.1", optional = true }

# TASK-128〜130（Issue #178）: GPU バッチ経路（`gpu_batch.rs`）用の依存。
# .claude/rules/dependency-policy.md の承認事項をここに記録する
# （**オーナー承認済み: 2026-08-26。Issue #178 のコメントに承認記録あり**）。
#   - クレート: wgpu = "=30.0.1"（default-features = false）
#   - 目的: Vulkan/Metal/DX12 を単一 API で扱うクロスプラットフォーム GPU
#     compute。各 GPU API を自作 FFI で叩くと依存最小方針に反して肥大化する
#   - ライセンス: MIT OR Apache-2.0（本リポと同一）
#   - メンテ状況: gfx-rs/wgpu。2026-08-26 時点で crates.io 最新版
#   - 推移的依存: `Cargo.lock` diff で新規 100 パッケージ（`cargo tree -p
#     engine` で実測。`parking_lot`/`parking_lot_core` を含む——wgpu-core が
#     間接的に要求するため features 指定では除外できない）
#   - feature はゲート化しない（CORE-12: 経路上書き機構を作らない方針。
#     GPU の可否は実行時の初期化結果のみで決まる）
wgpu = { version = "=30.0.1", default-features = false, features = [
    "std",
    "vulkan",
    "metal",
    "dx12",
    "wgsl",
] }

# Issue #333（SEARCH-7 方式変更。クロスエンコーダ型リランカーの導入）:
# `rerank::CrossEncoderReranker`（`rerank.rs`）が呼ぶ実 ONNX 推論バックエンド
# （`src/rerank/cross_encoder_onnx.rs`。`cross-encoder` feature 限定）用の依存。
# 当初 `make deny` advisories が `tokenizers` の推移的依存 `paste`
# （unmaintained・RUSTSEC-2024-0436）で fail したためロールバックしたが、
# オーナー承認済み（2026-08-30・Issue #333 再 open コメント）で
# `deny.toml` の `[advisories] ignore` へ登録のうえ追加した。
#   - `ort = "=2.0.0-rc.13"`（default-features = false。ビルド時バイナリ
#     ダウンロードなし・実行時 `ORT_DYLIB_PATH` で共有ライブラリを解決する
#     `load-dynamic` に加え、`ort-sys` 側の既定 API レベル `api-17`（`ort-sys` を
#     `default-features = false` にした際 `ort` の feature 経由で明示指定しないと
#     Session 構築・推論に必要なシンボルが有効化されない）を最小追加。テンソル
#     構築は `Tensor::from_array((shape, data))`（`(Vec<i64>, Vec<T>)` タプル）を
#     使うため `ndarray` feature は不要（ライセンス: MIT）。
#   - `tokenizers = "=0.23.1"`（default-features = false + `onig`。`tokenizer.json`
#     が正規表現ベースの pre-tokenizer 設定を含む場合のロードに必要な既定機能の
#     最小分。`esaxx_fast`／`progressbar`〔BPE 学習・進捗表示用〕は推論専用の
#     本用途では不要なため含めない）
# いずれも optional・下記 `cross-encoder` feature の背後に限定し、`wire-server` は
# リンクしない（`cargo tree -p wire-server` に出現しないことを確認済み）。
# .claude/rules/dependency-policy.md に従い完全固定（=x.y.z）で管理する。
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = [
    "load-dynamic",
    "api-17",
] }
tokenizers = { version = "=0.23.1", optional = true, default-features = false, features = [
    "onig",
] }

[features]
# CORE-5 の対照エンジン（usearch の総当たり `exact_search`）を bench 専用に有効化する
# feature。`test-support` feature 廃止時（本ファイル上部の redb dev-dependency コメント
# 参照）と異なり、テナント境界・RLS 迂回 API は一切露出しない
# （bench 専用の依存有効化のみで安全境界に触れない）。
contrast-bench = ["dep:usearch"]

# Issue #333（SEARCH-7 方式変更）: `rerank::CrossEncoderReranker` の実 ONNX 推論
# バックエンド（`src/rerank/cross_encoder_onnx.rs`）を有効化する feature。
# `contrast-bench` と同パターンで、既定ビルド・`wire-server` には一切結線しない
# （テナント境界・RLS 迂回 API は露出しない）。
cross-encoder = ["dep:ort", "dep:tokenizers"]

[dev-dependencies]
# codex P0-2 指摘（Issue #137）対応: 以前は `test-support` feature ＋ self
# dev-dependency で `EngineCore::storage`/`from_storage`（テナント境界の単一照合パス
# `PolicyContext::is_visible` を迂回できる生ハンドル API）を結合テストビルドだけへ
# 限定していたが、feature は公開面であり任意の依存元が有効化してテナント境界を
# 迂回しうる構造だった。`EngineCore::from_storage` を一方向の所有権移動（`Storage` を
# 渡すだけで取り出す経路を持たない）に設計変更し、feature 自体を廃止した
# （`crates/engine/src/core.rs` のドキュメント参照）。
# tests/persistence.rs・tests/power_loss.rs（対象ビヘイビア: PERSIST-1, PERSIST-4）が、
# Storage の公開 API では表現できないトランザクション境界・`StorageBackend` 差し替えに
# 踏み込んで検証するために同一バージョンの redb を直接操作する。新規依存の追加ではなく
# 上記と同一クレート・バージョンをテストスコープでも利用するのみ。
redb = "=4.2.0"

[[bench]]
# TASK-158（性能計測プロトコル基盤）の実走スモーク入口。
# harness = false: libtest のベンチハーネスは使わず `fn main` を直接実行する
# （外部依存追加なしの自作計測プロトコル。.claude/rules/dependency-policy.md）。
# test = false: `cargo test` の収集対象から外し、make ci の所要時間に影響させない
# （手動実行専用。プロトコル遵守の回帰は tests/bench_harness.rs が別途担う）。
name = "measurement"
harness = false
test = false

[[bench]]
# TASK-126（マルチスレッド並列の総当たり検索カーネル）の p95 手動計測入口。measurement
# 側の harness = false / test = false と同一方針（手動実行専用・make ci 対象外）。
name = "parallel_smoke"
harness = false
test = false

[[bench]]
# TASK-127（性能・Recall 受け入れ基準の回帰テスト化）の回帰ゲート入口。実測対象は
# `ParallelSearchProvider`（スレッド並列＋ TASK-156 の実行時検出 SIMD カーネル。
# `simd_bench.rs` 冒頭コメント参照）。Scalar 検出時は SIMD 経路が測定不能として
# fail-closed で拒否する。harness = false / test = false は上記 2 ベンチと同一方針
# （時間依存の測定値を make ci のアサーションへ混ぜない）。
# `make bench-simd`（Makefile）・`.github/workflows/bench.yml`
# （週次 schedule + workflow_dispatch）から
# 実行する。判定ロジック自体（時間非依存）は harness/accept.rs にあり
# tests/bench_accept.rs で make ci 側から回帰検証する。標準出力は pass/fail のみ
# （実測値は `--verbose` opt-in 限定・GitHub Actions 下では拒否。Issue #277）。
name = "simd_bench"
harness = false
test = false

[[bench]]
# TASK-127（CORE-5）の対照エンジン接続入口（Issue #176）。CORE-3/CORE-4
# （`simd_bench.rs`）とは別バイナリに分離し、対照エンジン（C++ FFI を含む
# `contrast-bench` feature）側の障害が CORE-3/CORE-4 ゲートを巻き込まないようにする
# （failure domain 分離。`harness/contrast.rs` 冒頭コメント参照）。
# `required-features` により `contrast-bench` feature 無指定のビルド（`make check-cross`
# 等）では本ベンチターゲット自体がスキップされ、usearch の C++ ビルドは走らない。
name = "contrast_bench"
harness = false
test = false
required-features = ["contrast-bench"]

[[bench]]
# TASK-130（バッチ高速化の受け入れ基準検証）の回帰ゲート入口。CORE-7（動的窓の
# 劣化上限）をアクティブなゲートとして実測し、CORE-6/CORE-16（実 GPU 未接続）は
# opt-in fail-closed で扱う（`batch_bench.rs` 冒頭コメント参照）。harness = false /
# test = false は上記ベンチと同一方針。`make bench-batch`（Makefile）・
# `.github/workflows/bench.yml`（workflow_dispatch）から実行する。判定ロジック自体
# （時間非依存）は harness/accept.rs にあり tests/batch_accept.rs で make ci 側から
# 回帰検証する。
name = "batch_bench"
harness = false
test = false

[[bench]]
# TASK-83（Conditional Go 条件7: C1 p95 専有環境再測定）の実測入口。実測対象は
# `EngineCore::execute_sql`（SQL 表層。`sql::exec::execute_statement`）経由の C1
# （純粋 Top-k）で、`simd_bench.rs`（provider 単体）とは異なりテーブル走査・
# 候補デコードを含む SQL 実行計画全体の p95 を測る。harness = false / test = false
# は上記ベンチと同一方針。`make bench-c1`（Makefile）・
# `.github/workflows/bench.yml`（workflow_dispatch 限定）から実行する。判定ロジック
# 自体（時間非依存）は harness/accept.rs にあり tests/c1_bench_accept.rs で
# make ci 側から回帰検証する。
name = "sql_c1_bench"
harness = false
test = false

[[bench]]
# TASK-116（ティア別レイテンシ受け入れ基準の検証。対象ビヘイビア PLAN-4, PLAN-6,
# PLAN-7。判定内容・測定段階は spec 側が SSOT）の実測入口。TASK-115（PLAN-8）の
# `EngineCore::with_tiered_query_planner` 経由で実 Ollama 接続により計測する。
# harness = false / test = false は上記ベンチと同一方針。`make bench-tier`
# （Makefile）から実行する。CI（.github/workflows/bench.yml）
# には実行経路を置かない（GitHub ホステッド runner に常駐 Ollama が無く、opt-in の
# 有無を問わず実測を成功させられないため。README「ティア別レイテンシ受け入れ基準の
# 実測手順」参照）。判定ロジック自体（時間非依存）は harness/tier.rs にあり
# tests/tier_latency_accept.rs で make ci 側から回帰検証する。
name = "tier_latency_bench"
harness = false
test = false

[[bench]]
# Issue #324（境界同点グループ再取得ループ〔Issue #320〕のレイテンシ影響計測。CORE-7・
# PLAN-4/6/7 の関連ポインタ）の実測入口。`hybrid::hybrid_search` を SQL パース・
# テーブル走査を含めずに直接計測し、再取得ループの寄与を単一ビルド内の A/B
# （通常コーパス vs 同点誘発コーパス）で切り分ける。spec 由来の pass/fail 閾値は
# 持たない情報提供専用ベンチのため `.github/workflows/*` へは配線しない。harness =
# false / test = false は上記ベンチと同一方針。`make bench-hybrid`（Makefile）から
# 実行する。判定ロジック自体（時間非依存）は harness/hybrid_latency.rs にあり
# tests/hybrid_latency_accept.rs で make ci 側から回帰検証する。
name = "hybrid_latency_bench"
harness = false
test = false

[[bench]]
# Issue #360（SQL パース・束縛結果のセッション内キャッシュ検討）の実測入口。
# `validate_sql` 単体・`validate_sql`＋スキーマ取得＋`bind_in_session`・
# `EngineCore::execute_sql` フル実行の 3 系列を計測し、パース・束縛コストが
# フル実行に対してどの程度の比率かを実測してキャッシュ導入の要否判断材料とする。
# spec 由来の pass/fail 閾値は持たない情報提供専用ベンチのため
# `.github/workflows/*` へは配線しない。harness = false / test = false は
# 上記ベンチと同一方針。`make bench-parse-bind`（Makefile）から実行する。
# 判定ロジック自体（時間非依存）は harness/parse_bind.rs にあり
# tests/parse_bind_bench_accept.rs で make ci 側から回帰検証する。
name = "sql_parse_bind_bench"
harness = false
test = false
