# engine: コアロジック層（検索カーネル・認証・RLS 相当のテナント境界・redb 永続化）。
# wire-server から呼ばれるライブラリクレート（.claude/rules/delegation-impl.md 参照）。
# TASK-66 時点では雛形のみで依存を持たない。
[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "engine"
path = "src/lib.rs"

[dependencies]
# TASK-140（永続化層）: オーナー承認済み（Issue #16）の唯一の依存。
# .claude/rules/dependency-policy.md に従い完全固定（=x.y.z）で管理する。
redb = "=4.2.0"

[dev-dependencies]
# PERSIST-1/4 の統合テスト（tests/persistence.rs）が、Storage の公開 API では
# 表現できないトランザクション境界（未コミット中断・書き込み直列化）を検証するために
# 同一バージョンの redb を直接操作する。新規依存の追加ではなく上記と同一クレート・
# バージョンをテストスコープでも利用するのみ。
redb = "=4.2.0"
