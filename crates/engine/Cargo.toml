# engine: コアロジック層（検索カーネル・認証・RLS 相当のテナント境界・redb 永続化）。
# wire-server から呼ばれるライブラリクレート（.claude/rules/delegation-impl.md 参照）。
# TASK-66 時点では雛形のみで依存を持たない。
[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "engine"
path = "src/lib.rs"

[dependencies]
# TASK-140（永続化層）: オーナー承認済み（Issue #16）の唯一の依存。
# .claude/rules/dependency-policy.md に従い完全固定（=x.y.z）で管理する。
redb = "=4.2.0"

[dev-dependencies]
# tests/persistence.rs（対象ビヘイビア: PERSIST-1, PERSIST-4）が、Storage の公開 API
# では表現できないトランザクション境界に踏み込んで検証するために同一バージョンの
# redb を直接操作する。新規依存の追加ではなく上記と同一クレート・バージョンを
# テストスコープでも利用するのみ。
redb = "=4.2.0"
# tests/power_loss.rs（PERSIST-3 の電源断シナリオ）が、`StorageBackend` を差し替えた
# `redb::Database` を本番の `Storage::put`/エンコーダ経由で検証できるように、
# `test-support` feature を有効にした自己参照（自クレートを dev-dependencies として
# 再宣言し、テストビルドでのみ追加 API を有効化する標準的な手法）。新規外部依存では
# ない。
engine = { path = ".", features = ["test-support"] }

[features]
# `Storage::from_database_for_testing`（バックエンド差し替え済み `redb::Database` を
# 受け取る内部コンストラクタ）をテストビルドでのみ有効化する。本番ビルド（feature 無効）
# には含まれない。
test-support = []
