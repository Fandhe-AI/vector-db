# engine: コアロジック層（検索カーネル・認証・RLS 相当のテナント境界・redb 永続化）。
# wire-server から呼ばれるライブラリクレート（.claude/rules/delegation-impl.md 参照）。
# TASK-66 時点では雛形のみで依存を持たない。
[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "engine"
path = "src/lib.rs"

[dependencies]
# TASK-140（永続化層）: オーナー承認済み（Issue #16）の唯一の依存。
# .claude/rules/dependency-policy.md に従い完全固定（=x.y.z）で管理する。
redb = "=4.2.0"

[features]
# レビュー指摘対応（Issue #32）: `EngineCore::storage`/`from_storage` はテナント境界の
# 単一照合パス（`PolicyContext::is_visible`）を迂回できるため、通常ビルド（wire-server 含む）
# には含めない。`tests/` 配下の結合テストのみへ限定して公開する（下記 self dev-dependency 参照）。
test-support = []

[dev-dependencies]
# self dev-dependency（新規外部依存ではない。`path = "."` で自クレートを指すのみ・
# Cargo.lock にエントリを追加しない）: `tests/` 配下の結合テストをビルドするときだけ
# `test-support` feature を有効化し、`EngineCore::storage`/`from_storage`（テナント境界の
# 単一照合パスを迂回する生ハンドル API）を通常ビルドの公開面から外す。
engine = { path = ".", features = ["test-support"] }
# tests/persistence.rs・tests/power_loss.rs（対象ビヘイビア: PERSIST-1, PERSIST-4）が、
# Storage の公開 API では表現できないトランザクション境界・`StorageBackend` 差し替えに
# 踏み込んで検証するために同一バージョンの redb を直接操作する。新規依存の追加ではなく
# 上記と同一クレート・バージョンをテストスコープでも利用するのみ。
redb = "=4.2.0"

[[bench]]
# TASK-158（性能計測プロトコル基盤）の実走スモーク入口。
# harness = false: libtest のベンチハーネスは使わず `fn main` を直接実行する
# （外部依存追加なしの自作計測プロトコル。.claude/rules/dependency-policy.md）。
# test = false: `cargo test` の収集対象から外し、make ci の所要時間に影響させない
# （手動実行専用。プロトコル遵守の回帰は tests/bench_harness.rs が別途担う）。
name = "measurement"
harness = false
test = false
